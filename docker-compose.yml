# docker-compose.yml — SIH.git local dev stack
#
# STATUS: checked against the real backend/frontend (Agent 1, integration
# scaffold pass) - env var names, Dockerfile locations, and the module
# path below are all confirmed, not inferred. Not yet run against an
# actual Docker daemon (still not available in that sandbox either) -
# if `docker compose up --build` surfaces anything, it's a first for
# this file.
#   backend  = Python 3.11, FastAPI + uvicorn, SQLAlchemy, Pydantic
#              (Postgres/Neon in prod, SQLite locally)
#   frontend = Vite + React 18 + TypeScript

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_pass
      POSTGRES_DB: sih_db
    ports:
      - "5432:5432"
    volumes:
      - sih_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih_user -d sih_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile        # confirmed: backend/Dockerfile already existed in SIH_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env              # copy from backend/.env.example first
    environment:
      # Confirmed against app/config.py:
      DATABASE_URL: postgresql+psycopg2://sih_user:sih_pass@db:5432/sih_db
      # Confirmed: the real var is ALLOWED_ORIGINS (comma-separated), not
      # CORS_ORIGINS - and the frontend below is actually served on 5173,
      # not 5173's container-internal 4173.
      ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Confirmed: app/main.py really does expose `app` from app.main.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile        # added - see AGENT5_RUNBOOK.md's own fallback, nothing else existed
      args:
        # Confirmed: frontend/.env.example already used this exact name.
        VITE_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "5173:4173"                 # 4173 = vite preview's default port
    depends_on:
      - backend

volumes:
  sih_pgdata:
